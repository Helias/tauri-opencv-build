name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.0)"
        required: true
        type: string
        default: "1.0.0"
      build_ubuntu:
        description: "Build for Ubuntu Linux"
        required: false
        type: boolean
        default: true
      build_windows:
        description: "Build for Windows"
        required: false
        type: boolean
        default: true
      build_macos_arm:
        description: "Build for macOS ARM64 (Apple Silicon)"
        required: false
        type: boolean
        default: true
      build_macos_intel:
        description: "Build for macOS Intel (x86_64)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if release already exists
          if gh release view "${{ github.event.inputs.version }}" --json isDraft 2>/dev/null; then
            echo "Release ${{ github.event.inputs.version }} already exists, reusing it"
          else
            echo "Creating new draft release ${{ github.event.inputs.version }}"
            gh release create "${{ github.event.inputs.version }}" \
              --draft \
              --title "Release ${{ github.event.inputs.version }}" \
              --notes "Release ${{ github.event.inputs.version }}"
          fi

  build-ubuntu:
    needs: create-release
    if: ${{ github.event.inputs.build_ubuntu == 'true' }}
    uses: ./.github/workflows/ubuntu.yml
    with:
      version: ${{ github.event.inputs.version }}
      release: true
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: create-release
    if: ${{ github.event.inputs.build_windows == 'true' }}
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ github.event.inputs.version }}
      release: true
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  build-macos-arm:
    needs: create-release
    if: ${{ github.event.inputs.build_macos_arm == 'true' }}
    uses: ./.github/workflows/macos-arm.yml
    with:
      version: ${{ github.event.inputs.version }}
      release: true
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  build-macos-intel:
    needs: create-release
    if: ${{ github.event.inputs.build_macos_intel == 'true' }}
    uses: ./.github/workflows/macos-intel.yml
    with:
      version: ${{ github.event.inputs.version }}
      release: true
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
